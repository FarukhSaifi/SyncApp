name: Request Copilot Review

# Best-effort: ask GitHub Copilot to review every non-draft PR.
# Uses `gh pr edit --add-reviewer @copilot` (the documented handle). The REST
# requested_reviewers endpoint can return 200 while silently ignoring Copilot.
#
# Requires the PR author to have Copilot code review access (Pro / Pro+ / Business /
# Enterprise, or eligible free allowance). If Copilot is unavailable, the job
# fails loudly so the gap is visible in Checks.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-copilot-review:
    name: Request Copilot review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Copilot as reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh pr view "$PR" --repo "$REPO" --json reviews --jq '.reviews[].author.login' \
            | grep -qiE 'copilot'; then
            echo "Copilot has already reviewed this PR."
            exit 0
          fi
          if gh pr view "$PR" --repo "$REPO" --json reviewRequests --jq '.reviewRequests[].login' \
            | grep -qiE 'copilot'; then
            echo "Copilot is already requested as a reviewer."
            exit 0
          fi
          gh pr edit "$PR" --repo "$REPO" --add-reviewer "@copilot"
          echo "Requested Copilot review on PR #$PR."
