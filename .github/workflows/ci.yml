name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: EAS platform to build
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: EAS build profile (preview/production need Apple credentials on Expo)
        required: true
        default: preview-simulator
        type: choice
        options:
          - preview-simulator
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install workspace dependencies
        run: npm install --workspaces --include=dev

      - name: Run lint
        working-directory: client
        run: npm run lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --workspaces --include=dev

      - name: Build client
        working-directory: client
        run: npm run build

  eas-build:
    name: EAS mobile build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install workspace dependencies
        run: npm install --workspaces --include=dev

      # Push → iOS simulator (no Apple signing). Device / store profiles need
      # credentials created once via `cd mobile && npx eas credentials` (interactive).
      - name: Resolve EAS target
        id: eas
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "platform=ios" >> "$GITHUB_OUTPUT"
            echo "profile=preview-simulator" >> "$GITHUB_OUTPUT"
          fi

      - name: Run EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TRIGGER }}
          EAS_PLATFORM: ${{ steps.eas.outputs.platform }}
          EAS_PROFILE: ${{ steps.eas.outputs.profile }}
        run: |
          set -euo pipefail
          echo "EAS build: platform=$EAS_PLATFORM profile=$EAS_PROFILE"
          if [ "$EAS_PROFILE" = "preview" ] || [ "$EAS_PROFILE" = "production" ]; then
            echo "::notice::Device/store profiles require remote Apple credentials on Expo. If this fails, run locally: cd mobile && npx eas credentials -p ios"
          fi
          npx eas-cli@latest build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive
