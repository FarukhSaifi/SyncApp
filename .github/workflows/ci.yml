name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: EAS platform to build
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: EAS build profile (preview/production need Apple credentials on Expo)
        required: true
        default: preview-simulator
        type: choice
        options:
          - preview-simulator
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install workspace dependencies
        run: npm install --workspaces --include=dev

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install workspace dependencies
        run: npm install --workspaces --include=dev

      - name: Run typecheck
        run: npm run typecheck

  build-client:
    name: Client production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --workspaces --include=dev

      - name: Build client
        working-directory: client
        run: npm run build

  build-server:
    name: Server production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --workspaces --include=dev

      - name: Build server
        working-directory: server
        run: npm run build

  # Exact check name required by Vercel Deployment Checks on sync-app-client
  # and sync-app-server (blocks production domain alias until this passes).
  production-gate:
    name: Production gate
    needs: [lint, typecheck, build-client, build-server]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require upstream jobs to succeed
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          BUILD_CLIENT: ${{ needs.build-client.result }}
          BUILD_SERVER: ${{ needs.build-server.result }}
        run: |
          set -euo pipefail
          echo "ESLint=$LINT"
          echo "Typecheck=$TYPECHECK"
          echo "Client production build=$BUILD_CLIENT"
          echo "Server production build=$BUILD_SERVER"
          ok=1
          for result in "$LINT" "$TYPECHECK" "$BUILD_CLIENT" "$BUILD_SERVER"; do
            if [ "$result" != "success" ]; then
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Production gate failed because one or more required CI jobs did not succeed."
            exit 1
          fi
          echo "Production gate passed."

  eas-build:
    name: EAS mobile build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install workspace dependencies
        run: npm install --workspaces --include=dev

      # Push → iOS simulator (no Apple signing). Device / store profiles need
      # credentials created once via `cd mobile && npx eas credentials` (interactive).
      - name: Resolve EAS target
        id: eas
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "platform=ios" >> "$GITHUB_OUTPUT"
            echo "profile=preview-simulator" >> "$GITHUB_OUTPUT"
          fi

      - name: Run EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TRIGGER }}
          EAS_PLATFORM: ${{ steps.eas.outputs.platform }}
          EAS_PROFILE: ${{ steps.eas.outputs.profile }}
        run: |
          set -euo pipefail
          echo "EAS build: platform=$EAS_PLATFORM profile=$EAS_PROFILE"
          if [ "$EAS_PROFILE" = "preview" ] || [ "$EAS_PROFILE" = "production" ]; then
            echo "::notice::Device/store profiles require remote Apple credentials on Expo. If this fails, run locally: cd mobile && npx eas credentials -p ios"
          fi
          npx eas-cli@latest build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive
